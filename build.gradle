plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'Timey'
version = '0.1.0'

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'timey.Timey'
}

javafx {
    version = '25.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Keep the interactive CLI connected to the terminal when launched with `gradle run`.
tasks.named('run') {
    standardInput = System.in
}

tasks.register('runDashboard', JavaExec) {
    group = 'application'
    description = 'Launches the Timey JavaFX dashboard.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'timey.ui.dashboard.DashboardLauncher'
}
