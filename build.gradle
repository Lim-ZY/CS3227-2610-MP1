plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.5.0'
}

group = 'Timey'
version = '0.2.0'

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'timey.Timey'
}

javafx {
    version = '25.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    String javaFxVersion = '25.0.1'
    def platforms = ['win', 'mac', 'mac-aarch64', 'linux']
    def fxModules = ['javafx-base', 'javafx-controls', 'javafx-fxml', 'javafx-graphics']

    fxModules.each { fxModule ->
        platforms.each { platform ->
            implementation "org.openjfx:${fxModule}:${javaFxVersion}:${platform}"
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    description = 'Builds the executable fat JAR in the release directory.'
    destinationDirectory = layout.projectDirectory.dir('release')
    archiveFileName = "Timey-${project.version}-all.jar"
    manifest {
        attributes('Main-Class': 'timey.ui.dashboard.DashboardLauncher')
    }
}

// Keep the interactive CLI connected to the terminal when launched with `gradle run`.
tasks.named('run') {
    standardInput = System.in
}

tasks.register('runDashboard', JavaExec) {
    group = 'application'
    description = 'Launches the Timey JavaFX dashboard.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'timey.ui.dashboard.DashboardLauncher'
}
