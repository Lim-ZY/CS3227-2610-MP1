# Copy this file to application.properties and fill in local credentials.
# Never commit application.properties or API keys.
timezone=Asia/Singapore
departure-buffer-minutes=10

# A comma-separated list displayed in Timey's Saved locations menu.
saved-locations=COM3,Home

# Fixed commute timings created with `add` are stored locally in data/fixed-commutes.properties.

# OneMap Search and Routing APIs require an access token. Prefer setting the
# ONEMAP_ACCESS_TOKEN environment variable; this local file is also supported.
onemap.access-token=
